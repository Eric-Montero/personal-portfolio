<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa de GameZoneDL</title>
  <desc id="desc">Mockup de la interfaz gamer de GameZoneDL con hero, valoración, categorías y tarjetas de contenido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gaming" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#07140f"/>
      <stop offset="1" stop-color="#27120b"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="70%" cy="38%" r="48%">
      <stop offset="0" stop-color="#00ff88" stop-opacity=".42"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="92%" cy="55%" r="38%">
      <stop offset="0" stop-color="#ff6b35" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#334155"/>

  <!-- Navigation -->
  <rect x="0" y="0" width="1200" height="76" rx="28" fill="#080a0d"/>
  <rect x="0" y="48" width="1200" height="28" fill="#080a0d"/>
  <path d="M36 38h20l8-13 9 26 10-17h18" fill="none" stroke="url(#gaming)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="46" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">GAME ZONE</text>
  <text x="265" y="46" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#00ff88">DL</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#a7b0bf">
    <text x="420" y="44">Juegos</text>
    <text x="505" y="44">Categorías</text>
    <text x="610" y="44">Colecciones</text>
    <text x="725" y="44">Comunidad</text>
    <text x="835" y="44">Marketplace</text>
  </g>
  <rect x="1030" y="22" width="136" height="36" rx="18" fill="#10161d" stroke="#2c3744"/>
  <circle cx="1054" cy="40" r="7" fill="#00ff88"/>
  <text x="1070" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#e5e7eb">En producción</text>

  <!-- Hero -->
  <rect x="28" y="96" width="1144" height="382" rx="24" fill="url(#hero)" filter="url(#shadow)"/>
  <rect x="28" y="96" width="1144" height="382" rx="24" fill="url(#glowGreen)"/>
  <rect x="28" y="96" width="1144" height="382" rx="24" fill="url(#glowOrange)"/>
  <path d="M857 126c86 22 160 88 204 176-54-8-109 6-158 36-48 29-89 70-116 118-39-58-57-127-49-197 8-59 49-113 119-133Z" fill="#0f172a" opacity=".84"/>
  <circle cx="910" cy="226" r="66" fill="#00ff88" opacity=".12"/>
  <circle cx="1008" cy="328" r="94" fill="#ff6b35" opacity=".12"/>
  <path d="M825 343c57-80 132-120 224-122" fill="none" stroke="#00ff88" stroke-opacity=".28" stroke-width="3"/>
  <path d="M810 388c77-47 173-56 286-25" fill="none" stroke="#ff6b35" stroke-opacity=".25" stroke-width="3"/>

  <rect x="72" y="132" width="154" height="32" rx="16" fill="#08281b" stroke="#00ff88" stroke-opacity=".4"/>
  <circle cx="91" cy="148" r="5" fill="#00ff88"/>
  <text x="105" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4ade80">Juego destacado</text>

  <text x="72" y="225" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#ffffff">Explora. Juega.</text>
  <text x="72" y="286" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="url(#gaming)">Conecta.</text>
  <text x="72" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c1cad6">Catálogo, reseñas, favoritos, comunidad y contenido gamer</text>
  <text x="72" y="350" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c1cad6">en una experiencia web moderna y responsiva.</text>

  <rect x="72" y="383" width="174" height="50" rx="12" fill="url(#gaming)"/>
  <text x="108" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#050505">Explorar juegos</text>
  <rect x="260" y="383" width="146" height="50" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".26"/>
  <text x="291" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Ver detalles</text>

  <rect x="880" y="158" width="222" height="258" rx="20" fill="#0b1118" stroke="#344150"/>
  <rect x="896" y="174" width="190" height="132" rx="14" fill="#161f2b"/>
  <circle cx="992" cy="239" r="46" fill="none" stroke="url(#gaming)" stroke-width="8"/>
  <path d="M969 246c11-19 35-19 46 0m-29-17h12m-6-6v12" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="898" y="337" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Experiencia gamer</text>
  <text x="898" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">Next.js · React · Tailwind</text>
  <rect x="898" y="380" width="76" height="24" rx="12" fill="#2a210b"/>
  <text x="914" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#facc15">★ 9.2</text>
  <rect x="984" y="380" width="100" height="24" rx="12" fill="#08281b"/>
  <text x="998" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4ade80">DESTACADO</text>

  <!-- Lower cards -->
  <text x="36" y="526" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Más que un catálogo</text>
  <text x="36" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8895a7">Módulos que muestran amplitud de producto y frontend.</text>

  <g filter="url(#shadow)">
    <rect x="36" y="578" width="260" height="106" rx="18" fill="#0d131b" stroke="#273344"/>
    <rect x="316" y="578" width="260" height="106" rx="18" fill="#0d131b" stroke="#273344"/>
    <rect x="596" y="578" width="260" height="106" rx="18" fill="#0d131b" stroke="#273344"/>
    <rect x="876" y="578" width="288" height="106" rx="18" fill="#0d131b" stroke="#273344"/>
  </g>

  <circle cx="72" cy="616" r="18" fill="#08281b"/>
  <path d="M64 616h16m-8-8v16" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="614" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Catálogo</text>
  <text x="102" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">Búsqueda y filtros</text>
  <text x="102" y="657" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">por categorías</text>

  <circle cx="352" cy="616" r="18" fill="#2a160c"/>
  <path d="M345 615h14m-7-7v14" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
  <text x="382" y="614" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Comunidad</text>
  <text x="382" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">Posts, actividad</text>
  <text x="382" y="657" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">y valoraciones</text>

  <circle cx="632" cy="616" r="18" fill="#17102b"/>
  <path d="M624 616h16M632 608v16" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <text x="662" y="614" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Colecciones</text>
  <text x="662" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">Favoritos y listas</text>
  <text x="662" y="657" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">personalizadas</text>

  <circle cx="912" cy="616" r="18" fill="#08281b"/>
  <path d="M903 617l6 6 13-15" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="942" y="614" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Proyecto desplegado</text>
  <text x="942" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">Demo pública en Vercel</text>
  <text x="942" y="657" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94a3b8">Código disponible en GitHub</text>
</svg>